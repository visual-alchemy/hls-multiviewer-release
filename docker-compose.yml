services:
  # ==========================================
  # PRIMARY 1 (Port 3111)
  # ==========================================
  app-primary-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hls-multiviewer-app-primary-1
    restart: unless-stopped
    expose:
      - "3111"
    volumes:
      - ./data_primary_1:/app/data
    networks:
      - multiviewer

  proxy-primary-1:
    image: openresty/openresty:alpine
    container_name: hls-multiviewer-proxy-primary-1
    restart: unless-stopped
    ports:
      - "3111:80"
    volumes:
      - ./nginx_proxy.conf.template:/tmp/default.conf.template:ro
    environment:
      - UPSTREAM_HOST=app-primary-1:3111
    command: /bin/sh -c "cp /tmp/default.conf.template /etc/nginx/conf.d/default.conf && sed -i 's/$${UPSTREAM_HOST}/'$$UPSTREAM_HOST'/g' /etc/nginx/conf.d/default.conf && /usr/local/openresty/bin/openresty -g 'daemon off;'"
    depends_on:
      - app-primary-1
    networks:
      - multiviewer

  # ==========================================
  # KONTEN 1 (Port 3116)
  # ==========================================
  app-konten-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hls-multiviewer-app-konten-1
    restart: unless-stopped
    expose:
      - "3111"
    volumes:
      - ./data_konten_1:/app/data
    networks:
      - multiviewer

  proxy-konten-1:
    image: openresty/openresty:alpine
    container_name: hls-multiviewer-proxy-konten-1
    restart: unless-stopped
    ports:
      - "3116:80"
    volumes:
      - ./nginx_proxy.conf.template:/tmp/default.conf.template:ro
    environment:
      - UPSTREAM_HOST=app-konten-1:3111
    command: /bin/sh -c "cp /tmp/default.conf.template /etc/nginx/conf.d/default.conf && sed -i 's/$${UPSTREAM_HOST}/'$$UPSTREAM_HOST'/g' /etc/nginx/conf.d/default.conf && /usr/local/openresty/bin/openresty -g 'daemon off;'"
    depends_on:
      - app-konten-1
    networks:
      - multiviewer

networks:
  multiviewer:
    driver: bridge
