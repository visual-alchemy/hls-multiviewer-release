services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hls-multiviewer-app
    restart: unless-stopped
    expose:
      - "3111"
    networks:
      - multiviewer

  proxy:
    image: openresty/openresty:alpine
    container_name: hls-multiviewer-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx_proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - multiviewer

networks:
  multiviewer:
    driver: bridge
